[project]
name = "matterwave-sdk"
dynamic = ["version"]
description = "Python client for the MatterWave API (the OpenAI-compatible /v1 surface)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "MatterWave AI Contributors" }]
keywords = ["matterwave", "openai", "api", "client", "llm", "chat", "streaming"]
dependencies = [
    "httpx>=0.27",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/MatterWaveAI/python-sdk"
Repository = "https://github.com/MatterWaveAI/python-sdk"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/matterwave_sdk/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/matterwave_sdk"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"__init__.py" = ["F401"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src/matterwave_sdk"]
