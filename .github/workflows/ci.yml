# CI on every push and pull request: lint, format, types and the suite, on
# each supported Python. The publish workflow (publish-pypi.yml) stays
# tag-only and runs the same checks before building.
#
# Run it by hand with `openapi_source` (a URL of the app's exported
# docs/developers/openapi.json) to test this client against that API: the
# snapshot in tests/openapi.json is refreshed from it before the tests.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      openapi_source:
        description: "URL of the app's openapi.json to test against (blank: the committed snapshot)"
        required: false
        default: ""

# The workflow token reads the repository and nothing else; a job that
# needs more says so itself.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every Python `requires-python` admits that is still maintained.
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --extra dev
      - name: Refresh the OpenAPI snapshot from the given source
        if: github.event_name == 'workflow_dispatch' && inputs.openapi_source != ''
        env:
          OPENAPI_SOURCE: ${{ inputs.openapi_source }}
        run: |
          uv run python scripts/refresh_openapi.py "$OPENAPI_SOURCE"
          git diff --stat tests/openapi.json
      - run: uv run ruff check
      - run: uv run ruff format --check
      - name: No private ticket ids in tracked files
        run: sh scripts/check-ticket-ids.sh
      - run: uv run mypy
      # The agent contract's one source is here; the TypeScript SDK carries a
      # generated copy. Check it out beside this repo (the same branch when
      # it has one) so the drift check, and the suite's own, have it to read.
      - name: Check out the TypeScript SDK beside this repo
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git clone --depth 1 --branch "$BRANCH" https://github.com/MatterWaveAI/typescript-sdk ../typescript-sdk \
            || git clone --depth 1 https://github.com/MatterWaveAI/typescript-sdk ../typescript-sdk
      - name: The TypeScript SDK's agent contract matches contract.json
        run: uv run python scripts/gen_agent_contract.py --check --ts-sdk ../typescript-sdk
      - run: uv run pytest

  # Every commit on the branch, not just the tip: a secret removed in a
  # later commit is still in the history anyone can clone.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Scan the history for committed secrets
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          ./gitleaks git --redact --verbose .
