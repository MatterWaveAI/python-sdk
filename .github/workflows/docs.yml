# The API reference: pdoc over the public package, checked to cover every
# public name, uploaded as the `api-reference` artifact. That artifact is
# what the docs site publishes.
name: docs

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Build the reference
        run: uv run --with pdoc==15.0.4 pdoc -o reference matterwave_sdk
      - name: Every public name has its page
        run: uv run python scripts/check_reference.py reference
      - uses: actions/upload-artifact@v4
        with:
          name: api-reference
          path: reference
